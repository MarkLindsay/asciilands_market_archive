name: Archive market data

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run archiver
        run: python asciilands_market_archive.py

      - name: Commit snapshots
        run: |
          git config user.name "asciilands_market_archive[bot]"
          git config user.email "asciilands_market_archive[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "archive: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
